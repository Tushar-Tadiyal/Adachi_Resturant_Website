<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tipcal.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div id="main">
        <div id="nav">
            <div id="navleft">
              <div id="box"><a href="index.html"><i class="ri-menu-line"></i></a></div>
              <div id="lleft">Tip Calculator</div>
              <div id="lright">Adachi</div>
            </div>
            <div id="navright">
                <div class="navboxes"><button class="button"><a href="contact.html">+919340394856</a></button></div>
                <div class="navboxes"><button class="button"><a href="specials.html">Specials</a></button></div>
                <div class="navboxes"><button class="button"><a href="./menu/index.html">Menu</a></button></div>
            </div>
        </div>
    </div>
    <div class="container">
      <form action="index.html" method="post" id="tipForm">
        <h1>Tip Calculator</h1>
        <div class="inputs">
          <div class="flex">
            <label for="bill_amount">Bill total:</label>
            <input type="number" name="bill_amount" id="bill" min="0" placeholder="$0">
          </div>
          <div class="flex">
            <label for="service_quality">Service quality:</label>
            <select name="service_quality" id="service" form="tipForm">
                          
                              <option value="0.20">Outstanding</option>
                              <option value="0.15">Good</option>
                              <option value="0.10">Average</option>
                              <option value="0.05">Bad</option>
                          </select>
          </div>
          <div class="flex">
            <label for="split_bill">People sharing bill?</label>
            <input type="number" name="split_bill" id="split" min="1" placeholder="0">
          </div>
          <div id="result">$--</div>
        </div>
        <div class="flex-btn">
          <button type="button" onclick="calculateTip()" id="calc-btn">Calculate</button>
        </div>
      </form>
    </div>
    <script src="tipcal.js"></script>
</body>
</html>
